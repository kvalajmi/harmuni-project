services:
  app:
    container_name: harmuni-task
    image: kvalajmi/harmuni-task:latest
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - harmuni-network

networks:
  harmuni-network:
    driver: bridge
